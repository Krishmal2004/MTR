[package]
name = "tui-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tui-runner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net"] }
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = "thin"
